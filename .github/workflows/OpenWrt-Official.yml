          	m=$(printf '%s' "$m" | tr -d ' ' | tr -d '\r')
          	[ -z "$m" ] && return 1
          	MU=$(printf '%s' "$m" | tr 'a-z' 'A-Z')
          	ln=""
          	[ -r "$MDB" ] && ln=$(awk -F'\t' -v k="$MU" '$1==k{print $2"\t"$3;exit}' "$MDB" 2>/dev/null)
          	if [ -z "$ln" ]; then
          		echo "$m" | cut -c1-24
          		return 0
          	fi
          	br=$(printf '%s' "$ln" | cut -f1 | tr -d ' ')
          	nm=$(printf '%s' "$ln" | cut -f2 | tr -d ' ')
          	if [ -z "$nm" ]; then
          		echo "$m" | cut -c1-24
          		return 0
          	fi
          	case "$nm" in
          		*"$br"*) printf '%s\n' "$nm" ;;
          		*)
          			if [ ${#nm} -le 14 ] && [ -n "$br" ]; then
          				printf '%s\n' "$br$nm"
          			else
          				printf '%s\n' "$nm"
          			fi ;;
          	esac | cut -c1-24
          	return 0
          }

          is_local_mac() {
          	first=$(printf '%s' "$1" | cut -d: -f1)
          	case "$first" in
          		[0-9a-fA-F][0-9a-fA-F]) ;;
          		*) return 1 ;;
