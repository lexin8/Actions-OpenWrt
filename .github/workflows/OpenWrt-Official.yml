          cat > package/oui-vendor/files/oui-ua-probe << 'SHEOF'
          #!/bin/sh
          # oui-ua-probe -- 被动抓内网明文 HTTP 的 User-Agent（对应爱快的 DPI/UA 识别）
          # 只抓 80 端口、只截前 900 字节，不改流量、不劫持；结果写 /var/run/oui-ua/<ip>
          # 安卓 UA 里带型号代码（如 SM-S911B），由 oui_lease_names 查内置型号库得到品牌机型。
          IF=${1:-br-lan}
          UAD=${OUI_UA_DIR:-/var/run/oui-ua}
          mkdir -p "$UAD" 2>/dev/null

          exec tcpdump -i "$IF" -s 900 -A -l -q 'tcp dst port 80' 2>/dev/null | \
          awk -v OFS='\t' '
          {
          	n = split($0, w, " ")
          	for (i = 1; i <= n; i++) {
          		if (w[i] == "IP" && w[i+1] ~ /^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+\./) {
          			split(w[i+1], a, ".")
          			ip = a[1] "." a[2] "." a[3] "." a[4]
          			break
          		}
          	}
          }
          /User-Agent:/ {
          	ua = $0
          	sub(/^[ \t]+/, "", ua)
          	sub(/.*User-Agent:[ \t]*/, "", ua)
          	sub(/[\r\t].*/, "", ua)
          	if (ip != "" && length(ua) > 0) print ip, substr(ua, 1, 200)
          }
          ' | while IFS="$(printf '\t')" read -r ip ua; do
          	[ -z "$ip" ] && continue
          	[ -z "$ua" ] && continue
          	printf 'UA=%s\n' "$ua" > "$UAD/$ip" 2>/dev/null
          done
          SHEOF

