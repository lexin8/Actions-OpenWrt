          			[ -n "$vc" ] && label=$(sys_from_class "$vc")
          		fi
          		if [ -z "$label" ]; then
          			label=$(sys_from_req "$(fp_get "$mac" REQ)")
          		fi
          		if [ -z "$label" ] && ! is_local_mac "$mac"; then
          			label=$(OUI_DB="$DB" oui_lookup -s "$mac" 2>/dev/null)
          			case "$label" in ""|Unknown) label="" ;; esac
          		fi
          		if [ -z "$label" ]; then
          			old=$(sed -n "s/^$mac //p" "$NAMES" 2>/dev/null | head -n 1)
          			[ -n "$old" ] && label=$(printf '%s' "$old" | sed 's/-[0-9a-f]\{6\}$//')
          		fi
          		[ -z "$label" ] && label=Unknown
          		name="$label-$t"
          		rec "$mac" "$name"
          	fi

          	if [ -n "$rest" ]; then
          		printf '%s %s %s %s %s\n' "$ts" "$mac" "$ip" "$name" "$rest"
          	else
          		printf '%s %s %s %s\n' "$ts" "$mac" "$ip" "$name"
          	fi
          done < "$SRC" > "$TMP"

          if cmp -s "$SRC" "$TMP" 2>/dev/null; then
          	rm -f "$TMP"
          else
          	cp -f "$SRC" "$SRC.oui.bak" 2>/dev/null
          	cat "$TMP" > "$SRC"   # 保留 inode，dnsmasq 的句柄仍然有效
          	rm -f "$TMP"
          fi

          if [ "$OUT" != "$SRC" ]; then
          	cp -f "$SRC" "$OUT" 2>/dev/null
          fi
