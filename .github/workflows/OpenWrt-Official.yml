          TMP="$SRC.oui.tmp"
          : > "$TMP"
          while IFS=' ' read -r ts mac ip name rest; do
          	[ -z "$ts" ] && continue
          	t=$(printf '%s' "$mac" | sed 's/[^0-9a-fA-F]//g' | tr 'A-F' 'a-f' | cut -c7-12)

          	# 只重算"没有名字"或"本脚本生成的名字"；用户/设备给的真实主机名一律保留
          	gen=0
          	if [ "$name" = "*" ] || [ -z "$name" ]; then
          		gen=1
          	else
          		case "$name" in
          			*-"$t") gen=1 ;;
          		esac
          	fi

          	if [ $gen -eq 1 ]; then
