          	if [ -n "$2" ]; then
          		echo "VC=$DNSMASQ_VENDOR_CLASS" > "$D/oui.$2" 2>/dev/null
          		echo "REQ=$DNSMASQ_REQUESTED_OPTIONS" >> "$D/oui.$2" 2>/dev/null
