          	case "$ua" in
          		*[Aa]ndroid*|*Dalvik*) ;;
          		*) return 1 ;;
          	esac
          	m=$(printf '%s' "$ua" | sed -n 's/.*[;(][ ]*\([A-Za-z0-9._-]\+\)[ ]*Build\/.*/\1/p' | head -n 1)
