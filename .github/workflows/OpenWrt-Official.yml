          #!/bin/sh
          # oui-mdns-probe -- 被动抓 mDNS(5353) 里设备自报的名称
          #   来源：_airplay._tcp（iPhone/iPad/Mac/AppleTV 的显示名）、_raop._tcp（含 MAC@名称）、
          #         _googlecast._tcp（Google/安卓投屏名）、_hap._tcp（HomeKit 配件）、_workstation._tcp
          # 只旁听、不改流量，结果写 /var/run/oui-mdns/<ip> 的 NAME=<名称>
          IF=${1:-br-lan}
          MD=${OUI_MDNS_DIR:-/var/run/oui-mdns}
          mkdir -p "$MD" 2>/dev/null

          exec tcpdump -i "$IF" -s 0 -A -l -q 'udp port 5353' 2>/dev/null | \
          awk '
          {
          	line = $0
          	if (match(line, /IP [0-9]+\.[0-9]+\.[0-9]+\.[0-9]+\./)) {
          		ip = substr(line, RSTART + 3, RLENGTH - 4)
          	}
          	if (ip == "") next
          	while (match(line, /\._(airplay|raop|googlecast|hap|workstation|companion-link|apple-mobdev2|rdlink|mediaremotetv|airport|device-info|http|ipps|printer|smb|afpovertcp|miio|home-assistant|esphomelib)\._(tcp|udp)/)) {
          		pre = substr(line, 1, RSTART - 1)
          		n = split(pre, a, ".")
          		label = a[n]
          		k = split(label, b, "@")
          		name = b[k]
          		gsub(/\\032/, " ", name)
          		sub(/\.local$/, "", name)
          		gsub(/^[.]+/, "", name)
          		gsub(/[[:cntrl:]]/, "", name)
          		if (length(name) >= 2 && length(name) <= 60 && name !~ /^[0-9a-fA-F]{12}$/ && name != "local" && name !~ /\.\./)
          			print ip "\t" name
          		line = substr(line, RSTART + RLENGTH)
          	}
          	# 再抓主机名（A/PTR 里的 xxx.local，很多设备只播主机名不播服务实例名）
          	rest = $0
          	while (match(rest, /[A-Za-z0-9_][A-Za-z0-9_-]{1,40}\.local/)) {
          		h = substr(rest, RSTART, RLENGTH - 6)
          		if (h !~ /^[0-9a-fA-F]{12}$/ && h != "local") print ip "\t" h
          		rest = substr(rest, RSTART + RLENGTH)
          	}
          }' | while IFS="$(printf '\t')" read -r ip name; do
          	[ -z "$ip" ] && continue
          	[ -z "$name" ] && continue
          	printf 'NAME=%s\n' "$name" > "$MD/$ip.oui.tmp" 2>/dev/null && mv -f "$MD/$ip.oui.tmp" "$MD/$ip" 2>/dev/null
          done
