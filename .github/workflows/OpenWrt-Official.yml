          # 随机 MAC 的手机当时只能写成 Unknown-xxxxxx，刷固件后也不会自动更新。
          # 本脚本在运行期用多源信息重算，只改"空 / Unknown-* / Phone*"，真实名字不动。
          #
          # 命名顺序（按用户要求：优先设备自报/系统类型，识别不到才用厂商）：
