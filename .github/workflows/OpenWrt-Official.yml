          # option 60 里的型号段（HUAWEI:openharmony:CHZ-AL00 -> CHZ-AL00）
          code_from_class() {
          	c=$(printf '%s' "$1" | awk -F: '{print $NF}')
          	[ -z "$c" ] && return 1
          	case "$c" in
          		android-dhcp-*|dhcpcd-*|udhcp*|MSFT*|*.*) return 1 ;;
          	esac
          	printf '%s' "$c" | grep -qE '[0-9]' || return 1
          	printf '%s' "$c" | grep -qE '^[A-Za-z0-9_-]{3,20}$' || return 1
          	model_by_code "$c"
          }

          is_local_mac() {
          	first=$(printf '%s' "$1" | cut -d: -f1)
          	case "$first" in [0-9a-f][0-9a-f]) ;; *) return 1 ;; esac
          	[ $(( 0x$first & 0x02 )) -ne 0 ]
          }

          rec() {
          	grep -vi "^$1 " "$NAMES" 2>/dev/null > "$NAMES.t"
          	printf '%s %s\n' "$1" "$2" >> "$NAMES.t"
          	mv -f "$NAMES.t" "$NAMES"
          }

          N=$(uci -q show dhcp 2>/dev/null | grep -c '=host$')
          [ "$N" -gt 0 ] || exit 0

          changed=0
          i=0
          while [ "$i" -lt "$N" ]; do
          	mac=$(uci -q get "dhcp.@host[$i].mac" 2>/dev/null | head -n 1)
          	name_raw=$(uci -q get "dhcp.@host[$i].name" 2>/dev/null)
          	name=$(printf '%s' "$name_raw" | sed -e "s/^'//" -e "s/'$//")
          	ip=$(uci -q get "dhcp.@host[$i].ip" 2>/dev/null)
          	i=$((i+1))
          	# 顺手清掉历史遗留的引号包裹（uci 存成了 '名字'）
          	if [ "$name_raw" != "$name" ]; then
          		uci -q set "dhcp.@host[$((i-1))].name=$name" && changed=1
          	fi
          	[ -z "$mac" ] && continue
          	M=$(norm_mac "$mac")
          	[ -z "$M" ] && continue
          	S=$(suffix6 "$M")

          	need=0
          	case "$name" in
          		""|Unknown*|Phone*|unknown*) need=1 ;;
          	esac
          	[ "$need" = 1 ] || continue

          	label=""

          	# 1) mDNS 自报名（设备自己起的名字，最真实）
          	if [ -n "$ip" ]; then
          		label=$(sed -n 's/^NAME=//p' "$MD/$ip" 2>/dev/null | head -n 1)
          		label=$(clean "$label")
          		case "$label" in local|Local|"") label="" ;; esac
          	fi

          	# 1b) DHCP 客户端自报的主机名（option 12，dnsmasq 事件里的 $4）
          	if [ -z "$label" ]; then
          		hn=$(fp_get "$M" HN)
          		case "$hn" in
          			""|\*|Unknown*|Phone*|unknown*|localhost|localhost.localdomain) ;;
          			*) label=$(clean "$hn") ;;
          		esac
          	fi

          	# 2) 型号库（HTTP UA 的安卓型号代码）
          	if [ -z "$label" ] && [ -n "$ip" ]; then
          		ua=$(sed -n 's/^UA=//p' "$UAD/$ip" 2>/dev/null | head -n 1)
          		[ -n "$ua" ] && label=$(ua_model "$ua")
          	fi

          	# 3) option 60 里的具体型号代码
          	if [ -z "$label" ]; then
          		vc=$(fp_get "$M" VC)
          		[ -n "$vc" ] && label=$(code_from_class "$vc")
          	fi

          	# 4) 具体系统类型（option 60）
          	if [ -z "$label" ]; then
          		vc=$(fp_get "$M" VC)
          		[ -n "$vc" ] && label=$(sys_from_class "$vc")
          	fi

          	# 5) option 55 指纹
          	if [ -z "$label" ]; then
          		label=$(sys_from_req "$(fp_get "$M" REQ)")
          	fi

          	# 6) MAC 厂商（只对全局 MAC 生效；随机/本地 MAC 前缀无意义）
          	if [ -z "$label" ] && ! is_local_mac "$M"; then
          		label=$(OUI_DB="$DB" oui_lookup -s "$M" 2>/dev/null)
          		case "$label" in ""|Unknown) label="" ;; esac
          	fi

          	# 7) 持久记录（重启后仍然沿用上次识别结果）
          	if [ -z "$label" ]; then
          		old=$(sed -n "s/^$M //p" "$NAMES" 2>/dev/null | head -n 1)
          		[ -n "$old" ] && label=$(printf '%s' "$old" | sed 's/-[0-9a-f]\{6\}$//')
          	fi

          	[ -z "$label" ] && continue
          	label=$(clean "$label")
          	[ -z "$label" ] && continue
          	case "$label" in Unknown*) continue ;; esac

          	new="$label-$S"
          	[ ${#new} -gt 45 ] && new="$(printf '%s' "$label" | cut -c1-33)-$S"
          	uci -q set "dhcp.@host[$((i-1))].name=$new" || continue
          	rec "$M" "$new"
          	changed=1
          done

          if [ "$changed" = 1 ]; then
          	uci -q commit dhcp
          	# 让 dnsmasq 用新的 host 名字应答（一次性，仅在有变化时）
          	/etc/init.d/dnsmasq reload >/dev/null 2>&1
          fi

          rmdir "$LK" 2>/dev/null
          exit 0
          SHEOF

          cat > package/oui-vendor/files/oui-names << 'SHEOF'
          #!/bin/sh /etc/rc.common
          # oui-names -- 开机时把"可读名字"租约副本挂到 /tmp/dhcp.leases 并刷新一次
          # START 必须早于 dnsmasq(19)：软链要在 dnsmasq 打开租约文件之前建好，否则写进旧 inode
          START=18
          USE_PROCD=0

          start() {
          	mkdir -p /etc/oaf
          	[ -f /etc/oaf/leases ] || : > /etc/oaf/leases
          	if [ ! -L /tmp/dhcp.leases ]; then
          		rm -f /tmp/dhcp.leases
          		ln -sf /etc/oaf/leases /tmp/dhcp.leases
          	fi
          	[ -x /usr/bin/oui_lease_names ] && /usr/bin/oui_lease_names >/dev/null 2>&1
          	# 静态主机名的运行期识别：mDNS/UA/指纹要等设备上线，所以延迟再跑一次
          	( sleep 45; /usr/bin/oui_apply_names >/dev/null 2>&1 ) &
          }

          stop() { :; }
          SHEOF


          echo "=== 拉取内置库（OUI + Google Play 型号库） ==="
          BASEURL=https://raw.githubusercontent.com/lexin8/Actions-OpenWrt/master/oui-data
          for f in oui-db.txt model-db.txt; do
            ok=0
            for i in 1 2 3; do
              if curl -fsSL --retry 2 --connect-timeout 20 --max-time 120 "$BASEURL/$f" \
                   -o "package/oui-vendor/files/$f"; then ok=1; break; fi
              echo "⚠️ $f 第 $i 次下载失败，5 秒后重试"; sleep 5
            done
            if [ "$ok" != "1" ]; then echo "❌ $f 下载失败"; exit 1; fi
            echo "✅ $f $(wc -l < package/oui-vendor/files/$f) 行"
          done
          test "$(wc -l < package/oui-vendor/files/oui-db.txt)" -gt 30000
          test "$(wc -l < package/oui-vendor/files/model-db.txt)" -gt 30000
          grep -q '^8C22D2 ' package/oui-vendor/files/oui-db.txt
          grep -q 'SM-S911B' package/oui-vendor/files/model-db.txt
          echo "✅ 内置库校验通过"

          chmod +x package/oui-vendor/files/oui_lookup \
                   package/oui-vendor/files/oui_lease_names \
                   package/oui-vendor/files/oui-dhcp-event \
                   package/oui-vendor/files/hotplug-10-oui-names \
                   package/oui-vendor/files/uci-defaults-oui-names \
                   package/oui-vendor/files/oui-ua-probe \
                   package/oui-vendor/files/oui-ua \
                   package/oui-vendor/files/oui-names \
                   package/oui-vendor/files/oui-mdns-probe \
                   package/oui-vendor/files/oui-mdns \
                   package/oui-vendor/files/oui_apply_names

          echo "--- 语法自检 ---"
          for f in package/oui-vendor/files/oui_lookup package/oui-vendor/files/oui_lease_names \
                   package/oui-vendor/files/oui-dhcp-event package/oui-vendor/files/hotplug-10-oui-names \
                   package/oui-vendor/files/uci-defaults-oui-names package/oui-vendor/files/oui-ua-probe \
                   package/oui-vendor/files/oui-ua package/oui-vendor/files/oui-names \
                   package/oui-vendor/files/oui-mdns-probe package/oui-vendor/files/oui-mdns \
                   package/oui-vendor/files/oui_apply_names; do
            sh -n "$f"
            echo "OK $f"
          done

          echo "--- 功能自检（全部用假库，不依赖已安装的 nmap/数据） ---"
          T=/tmp/oui-selftest
          rm -rf $T; mkdir -p $T/fp $T/fp2 $T/ua
          printf 'B4BDF1 Xiaomi Communications Co Ltd\n8C22D2 Hangzhou Hikvision Digital Technology Co., Ltd.\n70E94C Intel Corporate\n' > $T/oui.db
          printf 'SM-S911B\tSamsung\tGalaxy S23\n23013RK75C\tRedmi\tRedmi K60\n' > $T/model.db
          test "$(OUI_DB=$T/oui.db sh package/oui-vendor/files/oui_lookup -s b4:bd:f1)" = "Xiaomi"
          test "$(OUI_DB=$T/oui.db sh package/oui-vendor/files/oui_lookup -s 8C:22:D2:a3:fc:2c)" = "Hikvision"
          test "$(OUI_DB=$T/oui.db sh package/oui-vendor/files/oui_lookup 70-e9-4c)" = "Intel Corporate"
          echo "oui_lookup OK"

          # 1) 主机名保留 / 厂商 / 本地随机 MAC 不再硬编 Phone
          printf '1794000000 52:fa:b3:b4:bd:f1 192.168.1.10 * 01:52:fa:b3:b4:bd:f1\n1794000001 8c:22:d2:a3:fc:2c 192.168.1.11 * 01:8c:22:d2:a3:fc:2c\n1794000002 70:e9:4c:68:2e:b3 192.168.1.12 realhost 01:70:e9:4c:68:2e:b3\n' > $T/leases
          PATH=package/oui-vendor/files:$PATH OUI_DB=$T/oui.db OUI_MODEL_DB=$T/model.db \
            LE_SRC=$T/leases LE_OVERRIDE=$T/out1 OUI_NAMES_DB=$T/names1 \
            OUI_CLIENT_DB=$T/fp OUI_UA_DIR=$T/ua sh package/oui-vendor/files/oui_lease_names
          grep -q 'Hikvision-a3fc2c' $T/out1
          grep -q 'Unknown-b4bdf1' $T/out1
          grep -q 'realhost' $T/out1
          echo "vendor + hostname OK"

          # 2) option 55 指纹：iPhone 序列 / Android 序列（无 VC 也能判）
          printf '1794000003 6e:a7:e9:e8:06:e3 192.168.1.91 * 01:6e:a7:e9:e8:06:e3\n1794000004 de:e2:be:96:b2:50 192.168.1.20 * 01:de:e2:be:96:b2:50\n1794000005 2a:38:d0:9a:0f:3f 192.168.1.92 * 01:2a:38:d0:9a:0f:3f\n' > $T/leases2
          printf 'VC=\nREQ=1,121,3,6,15,119,252,95,44,46\n' > "$T/fp/oui.6e:a7:e9:e8:06:e3"
          printf 'VC=\nREQ=1,3,6,15,26,28,51,58,59,43,44,46\n' > "$T/fp/oui.de:e2:be:96:b2:50"
          printf 'VC=\nREQ=1,3,6,15,119,252,44,46\n' > "$T/fp/oui.2a:38:d0:9a:0f:3f"
          PATH=package/oui-vendor/files:$PATH OUI_DB=$T/oui.db OUI_MODEL_DB=$T/model.db \
            LE_SRC=$T/leases2 LE_OVERRIDE=$T/out2 OUI_NAMES_DB=$T/names2 \
            OUI_CLIENT_DB=$T/fp OUI_UA_DIR=$T/ua sh package/oui-vendor/files/oui_lease_names
          grep -q 'Apple-e806e3' $T/out2
          grep -q 'Android-96b250' $T/out2
          grep -q 'Linux-9a0f3f' $T/out2
          echo "opt55 fingerprint OK"

          # 3) 型号库：安卓 UA 里的型号代码 -> 品牌机型
          printf 'UA=Dalvik/2.1.0 (Linux; U; Android 13; SM-S911B Build/TP1A.220624.014)\n' > $T/ua/192.168.1.92
          printf '1794000005 2a:38:d0:9a:0f:3f 192.168.1.92 * 01:2a:38:d0:9a:0f:3f\n' > $T/leases3
          PATH=package/oui-vendor/files:$PATH OUI_DB=$T/oui.db OUI_MODEL_DB=$T/model.db \
            LE_SRC=$T/leases3 LE_OVERRIDE=$T/out3 OUI_NAMES_DB=$T/names3 \
            OUI_CLIENT_DB=$T/fp2 OUI_UA_DIR=$T/ua sh package/oui-vendor/files/oui_lease_names
          grep -q 'GalaxyS23-9a0f3f' $T/out3
          echo "model DB OK"

          # 4) 持久表：重启后没有任何指纹，名字仍从 /etc/oaf/names 回读
          printf '2a:38:d0:9a:0f:3f GalaxyS23-9a0f3f\n' > $T/names4
          PATH=package/oui-vendor/files:$PATH OUI_DB=$T/oui.db OUI_MODEL_DB=$T/model.db \
            LE_SRC=$T/leases3 LE_OVERRIDE=$T/out4 OUI_NAMES_DB=$T/names4 \
            OUI_CLIENT_DB=$T/fp3 OUI_UA_DIR=$T/ua9 sh package/oui-vendor/files/oui_lease_names
          grep -q 'GalaxyS23-9a0f3f' $T/out4
          echo "persist names OK"

          # 5) 钩子同时记录 option 60 与 option 55
          rm -rf $T/fp5; mkdir -p $T/fp5
          DNSMASQ_VENDOR_CLASS='android-dhcp-13' DNSMASQ_REQUESTED_OPTIONS='1,3,6,15,26,28,51,58,59,43,44,46' \
            OUI_FP_DIR=$T/fp5 sh package/oui-vendor/files/oui-dhcp-event add 11:22:33:44:55:66 192.168.1.30 h
          grep -q 'VC=android-dhcp-13' "$T/fp5/oui.11:22:33:44:55:66"
          grep -q 'REQ=1,3,6,15' "$T/fp5/oui.11:22:33:44:55:66"
          echo "dhcp hook OK"
          echo "✅ device identification package ready"

      - name: Build config
        run: |
          cat > .config << 'EOF'
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_Generic=y
          CONFIG_TARGET_KERNEL_PARTSIZE=100
          CONFIG_TARGET_ROOTFS_PARTSIZE=1024
          CONFIG_TARGET_ROOTFS_PERSIST_VAR=y
          CONFIG_TARGET_ROOTFS_EXT4FS=n
          CONFIG_PACKAGE_igmpproxy=y
          # 基础工具
          CONFIG_PACKAGE_which=y
          CONFIG_PACKAGE_bash=y
          CONFIG_PACKAGE_sudo=y
          CONFIG_PACKAGE_wget-ssl=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_unzip=y
          CONFIG_PACKAGE_vim=y
          CONFIG_PACKAGE_tcpdump=y
          CONFIG_PACKAGE_bind-dig=y
          CONFIG_PACKAGE_ethtool=y
          CONFIG_PACKAGE_procps-ng=y
          # 磁盘 / 分区 / 文件系统（刷机后补回数据分区、挂载 /opt/docker 用）
          CONFIG_PACKAGE_kmod-fs-ext4=y
          # 抓包 / 网络诊断 / 排障
          CONFIG_PACKAGE_nmap=y
          CONFIG_PACKAGE_jq=y
          CONFIG_PACKAGE_openssl-util=y
          CONFIG_PACKAGE_etherwake=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_luci-app-wol=y
          # IPSec 内核模块（docker 里 hwdsl2/ipsec-vpn-server 强依赖 xfrm/esp/af_key）
          # kmod-ipsec  = af_key + xfrm_algo + xfrm_ipcomp + xfrm_user
          # kmod-ipsec4 = ah4 + esp4 + ipcomp4 + xfrm4_tunnel（IPv4 数据面，缺了容器能起但隧道不通）
          CONFIG_PACKAGE_kmod-ipsec=y
          CONFIG_PACKAGE_kmod-ipsec4=y
          CONFIG_PACKAGE_kmod-nft-xfrm=y
          # 宿主机不再编 IKE 守护进程：IKEv1(L2TP/IPsec-PSK) 与 IKEv2 全部由 docker 里
          # Libreswan 4.15 + USE_DH2(modp1024) 承担，固件只保留 XFRM 接口支持（容器 xauth 模式用 ipsec-interface）。
          CONFIG_PACKAGE_kmod-xfrm-interface=y
          # L2TP/IPsec 模式（容器里 xl2tpd + pppd 走 l2tp_ppp，老固件同样装了这两个）
          CONFIG_PACKAGE_kmod-l2tp=y
          CONFIG_PACKAGE_kmod-pppol2tp=y
          # 内核 CryptoAPI 算法（ESP 用 AES-CBC-SHA256 / AES-GCM 必需）
          # 上一版固件实测：/proc/crypto 里只有 sha1、sha512，没有 sha256 与 hmac(sha256)，
          # 导致 ESP 只能退到 AES-CBC-SHA1（strongSwan 侧报 netlink ENOSYS）。
          CONFIG_PACKAGE_kmod-crypto-hash=y
          CONFIG_PACKAGE_kmod-crypto-hmac=y
          CONFIG_PACKAGE_kmod-crypto-cbc=y
          CONFIG_PACKAGE_kmod-crypto-sha1=y
          CONFIG_PACKAGE_kmod-crypto-sha256=y
          CONFIG_PACKAGE_kmod-crypto-sha512=y
          CONFIG_PACKAGE_kmod-crypto-ctr=y
          CONFIG_PACKAGE_kmod-crypto-gcm=y
          CONFIG_PACKAGE_kmod-crypto-ghash=y
          CONFIG_PACKAGE_kmod-crypto-authenc=y
          CONFIG_PACKAGE_kmod-crypto-des=y
          CONFIG_PACKAGE_kmod-crypto-aead=y
          CONFIG_PACKAGE_kmod-crypto-ecb=y
          CONFIG_PACKAGE_kmod-crypto-md5=y
          CONFIG_PACKAGE_kmod-crypto-seqiv=y
          CONFIG_PACKAGE_kmod-crypto-geniv=y
          CONFIG_PACKAGE_kmod-crypto-null=y
          CONFIG_PACKAGE_kmod-crypto-chacha20poly1305=y
          # 宿主机 xl2tpd（与老固件一致；老机装了但没启用，容器内自带一份在跑）
          CONFIG_PACKAGE_xl2tpd=y
          # 真正需要的基础设施（挂载 / HTTPS 证书）
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_px5g-standalone=y
          # LuCI 基础
          CONFIG_PACKAGE_uhttpd=y
          CONFIG_PACKAGE_uhttpd-mod-ubus=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-lib-nixio=y
          CONFIG_PACKAGE_luci-lib-jsonc=y
          CONFIG_PACKAGE_luci-lib-ip=y
          CONFIG_PACKAGE_rpcd=y
          CONFIG_PACKAGE_rpcd-mod-luci=y
          CONFIG_PACKAGE_lua=y
          CONFIG_PACKAGE_luci-mod-admin-full=y
          CONFIG_PACKAGE_luci-mod-network=y
          CONFIG_PACKAGE_luci-mod-firewall=y
          CONFIG_PACKAGE_luci-mod-system=y
          CONFIG_PACKAGE_luci-mod-status=y
          # LuCI 语言：luci-i18n-* 包是 HIDDEN（没有 prompt），直接写 CONFIG_PACKAGE_luci-i18n-xxx=y
          # 会被 make defconfig（conf --defconfig）丢弃。唯一起作用的开关是 LUCI_LANG_zh_Hans，
          # 它是所有 luci-i18n-*-zh-cn 包的 DEFAULT 来源。
          CONFIG_LUCI_LANG_zh_Hans=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y
          CONFIG_PACKAGE_luci-theme-argon=y
          # Docker 相关
          CONFIG_PACKAGE_docker=y
          CONFIG_PACKAGE_dockerd=y
          CONFIG_PACKAGE_docker-compose=y
          CONFIG_PACKAGE_luci-app-dockerman=y
          CONFIG_PACKAGE_libnetwork=y
          CONFIG_PACKAGE_kmod-nft-fib=y
          CONFIG_PACKAGE_kmod-nf-flow=y
          CONFIG_PACKAGE_kmod-nft-nat=y
          CONFIG_PACKAGE_kmod-nft-offload=y
          CONFIG_PACKAGE_kmod-ipt-raw=y
          CONFIG_PACKAGE_kmod-ipt-conntrack=y
          CONFIG_PACKAGE_kmod-ipt-nat=y
          CONFIG_PACKAGE_kmod-libcgroup=y
          CONFIG_PACKAGE_kmod-overlay=y
          CONFIG_PACKAGE_kmod-veth=y
          CONFIG_PACKAGE_kmod-bridge=y
          CONFIG_PACKAGE_kmod-br-netfilter=y
          # 隧道 / 网络协议（本机 network 里只有 pppoe/static/dhcp，不需要 ipip/vxlan/l2tp）
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_luci-proto-ipv6=y
          CONFIG_PACKAGE_luci-proto-ppp=y
          # DDNS
          CONFIG_PACKAGE_luci-app-ddns=y
          CONFIG_PACKAGE_ddns-scripts=y
          CONFIG_PACKAGE_ddns-scripts-cloudflare=y
          # UDPXY
          CONFIG_PACKAGE_luci-app-udpxy=y
          # 防火墙
          CONFIG_PACKAGE_luci-app-firewall=y
          CONFIG_PACKAGE_firewall=y
          CONFIG_PACKAGE_firewall4=y
          CONFIG_PACKAGE_nftables=y
          # dnsmasq-full 与 dnsmasq 提供同一批文件（/usr/sbin/dnsmasq、/etc/uci-defaults/…），
          # 两者同时进 rootfs 会让 opkg 报 check_data_file_clashes 并中止 package/install。
          # 必须显式关闭默认开启的 dnsmasq。
          # CONFIG_PACKAGE_dnsmasq is not set
          CONFIG_PACKAGE_dnsmasq-full=y
          # OpenClash
          CONFIG_PACKAGE_luci-app-openclash=y
          # PassWall2：不编（本机只用 OpenClash，省掉 xray-core / chinadns-ng / tproxy 这一串依赖）
          # 行为管理 / 应用过滤 (OAF)
          CONFIG_PACKAGE_luci-app-oaf=y
          CONFIG_PACKAGE_appfilter=y
          CONFIG_PACKAGE_kmod-oaf=y
          # MAC 厂商名查询 / 租约自动命名（数据来自 nmap 的 nmap-mac-prefixes）
          CONFIG_PACKAGE_oui-vendor=y
          # 其它
          CONFIG_PACKAGE_ucode-mod-socket=y
          CONFIG_PACKAGE_ucode-mod-math=y
          CONFIG_PACKAGE_uclient-fetch=y
          CONFIG_PACKAGE_ip-full=y
          CONFIG_PACKAGE_libpcap=y
          CONFIG_PACKAGE_coreutils-timeout=y
          # macvlan: docker macvlan network (iptv-server binds 192.168.10.68)
          CONFIG_PACKAGE_kmod-macvlan=y
          EOF
          make defconfig
          echo "✅ 配置完成 (openwrt v${{ matrix.version }})"


      - name: Add OUI vendor names (static hosts + LuCI v4/v6)
        continue-on-error: true
        run: |
          set -e

          exec > >(tee -a "$GITHUB_STEP_SUMMARY") 2>&1
          set -x
          echo "===== 1) 静态保留补厂商短名 ====="
          cat > package/oui-vendor/files/oui_host_names << 'SHEOF'
          #!/bin/sh
          [ -x /usr/bin/oui_lookup ] || exit 0
          N=$(uci -q show dhcp 2>/dev/null | grep -c '=host$')
          [ "$N" -gt 0 ] || exit 0
          i=0
          changed=0
          while [ "$i" -lt "$N" ]; do
              mac=$(uci -q get dhcp.@host[$i].mac 2>/dev/null | head -n1)
              name=$(uci -q get dhcp.@host[$i].name 2>/dev/null)
              if [ -n "$mac" ] && [ -z "$name" ]; then
                  v=$(oui_lookup -s "$mac" 2>/dev/null)
                  [ -z "$v" ] && v=Unknown
                  t=$(echo "$mac" | sed 's/[^0-9a-fA-F]//g' | tr 'A-F' 'a-f' | cut -c7-12)
                  uci -q set dhcp.@host[$i].name="$v-$t"
                  changed=1
              fi
              i=$((i+1))
          done
          [ "$changed" = "1" ] && uci -q commit dhcp
          exit 0
          SHEOF
          chmod +x package/oui-vendor/files/oui_host_names
          python3 - << 'PYEOF'
          mk = 'package/oui-vendor/Makefile'
          s = open(mk, encoding='utf-8').read()
          a = '$(INSTALL_BIN) $(PKG_BUILD_DIR)/uci-defaults-oui-names $(1)/etc/uci-defaults/99-oui-names'
          assert s.count(a) == 1, 'makefile anchor not unique'
          if 'oui_host_names' not in s:
              s = s.replace(a, a + '\n\t$(INSTALL_BIN) $(PKG_BUILD_DIR)/oui_host_names $(1)/usr/bin/oui_host_names')
              open(mk, 'w', encoding='utf-8').write(s)
          u = 'package/oui-vendor/files/uci-defaults-oui-names'
          t = open(u, encoding='utf-8').read()
          if 'oui_host_names' not in t:
              t = t.replace('exit 0', '[ -x /usr/bin/oui_host_names ] && /usr/bin/oui_host_names\nexit 0')
              open(u, 'w', encoding='utf-8').write(t)
          print('static-host naming wired')
          PYEOF
          echo "===== 2) LuCI 页面显示厂商 ====="
          curl -fsSL --retry 3 --max-time 60 https://raw.githubusercontent.com/nmap/nmap/master/nmap-mac-prefixes -o /tmp/oui.txt || { echo "WARN: OUI 数据下载失败，跳过前端补丁"; exit 0; }
          python3 - << 'PYEOF'
          import glob, json, re, sys
          try:
              def short(n):
                  n = n.split(',')[0]
                  n = re.sub(r'\b(Co\.|Corporation|Corp\.|Inc\.|Ltd\.?|GmbH|Limited|LLC|Company|Technolog\w*)\b.*$', '', n, flags=re.I).strip()
                  place = set('Shenzhen Beijing Hangzhou Shanghai Guangzhou Suzhou Dongguan Wuhan Chengdu Nanjing Zhuhai Fuzhou Xiamen Wuxi Qingdao Hefei Changsha Tianjin Chongqing Ningbo Jinan Zhengzhou Shantou Zhongshan Huizhou Foshan Quanzhou Wenzhou'.split())
                  w = [x for x in n.split() if x not in place]
                  return (w[0] if w else (n or 'Unknown'))[:14]
              db = {}
              for line in open('/tmp/oui.txt', encoding='utf-8', errors='ignore'):
                  line = line.strip()
                  if not line or line[0] == '#':
                      continue
                  p = line.split(None, 1)
                  if len(p) != 2 or len(p[0]) != 6:
                      continue
                  db[p[0].upper()] = short(p[1])
              if len(db) < 1000:
                  print('WARN: OUI entries too few:', len(db)); sys.exit(0)
              cands = glob.glob('feeds/luci/**/view/network/dhcp.js', recursive=True) + glob.glob('package/feeds/luci/**/view/network/dhcp.js', recursive=True)
              if not cands:
                  print('WARN: dhcp.js not found'); sys.exit(0)
              path = sorted(cands)[0]
              s = open(path, encoding='utf-8').read()
              if 'OUI_DB' in s:
                  print('already patched'); sys.exit(0)
              h = ("const OUI_DB=__DB__;"
                   "function ouiVendor(m){if(!m)return null;var p=String(m).replace(/[^0-9a-fA-F]/g,'').slice(0,6).toUpperCase();return OUI_DB[p]||null;}"
                   "function ouiTagDuid(d){if(!d)return d;var h=String(d).replace(/[^0-9a-fA-F]/g,'');if(h.length<12)return d;var mc=h.slice(-12).match(/../g).join(':');var v=ouiVendor(mc);return v?(d+' ('+v+')'):d;}")
              h = h.replace('__DB__', json.dumps(db, ensure_ascii=False, separators=(',', ':')))
              a1 = "'use strict';"
              if s.count(a1) != 1:
                  print('WARN: use strict anchor', s.count(a1)); sys.exit(0)
              s = s.replace(a1, a1 + h, 1)
              n1 = s.count('macdata[mac].vendor')
              if n1 != 2:
                  print('WARN: v4 anchors', n1); sys.exit(0)
              s = s.replace('macdata[mac].vendor', '(macdata[mac].vendor||ouiVendor(lease.macaddr))')
              n2 = s.count('lease.duid,lease.iaid')
              if n2 != 1:
                  print('WARN: v6 anchors', n2); sys.exit(0)
              s = s.replace('lease.duid,lease.iaid', 'ouiTagDuid(lease.duid),lease.iaid')
              a3 = 'vendor=macdata[lower_mac]?macdata[lower_mac].vendor:null;'
              if s.count(a3) != 1:
                  print('WARN: static anchor', s.count(a3)); sys.exit(0)
              s = s.replace(a3, 'vendor=(macdata[lower_mac]&&macdata[lower_mac].vendor)||ouiVendor(lower_mac);')
              open(path, 'w', encoding='utf-8').write(s)
              open('/tmp/dhcpjs_path', 'w').write(path)
              print('patched %s entries=%d size=%d' % (path, len(db), len(s)))
          except Exception as e:
              print('WARN: LuCI patch skipped:', e); sys.exit(0)
          PYEOF
          P=$(cat /tmp/dhcpjs_path 2>/dev/null || true)
          if [ -n "$P" ] && command -v node >/dev/null 2>&1; then
            node --check "$P" && echo "✅ dhcp.js 语法校验通过"
          else
            echo "ℹ️ 未做 node 校验（node 不可用或无补丁）"
          fi
          echo "✅ OUI 厂商名增强完成"
      - name: Verify Chinese language packages
        run: |
          # 语言开关若没生效，编译 4 小时后才会发现界面还是英文，所以这里提前 10 分钟失败
          MISSING=0
          grep -q '^CONFIG_LUCI_LANG_zh_Hans=y' .config || { echo "❌ CONFIG_LUCI_LANG_zh_Hans 未生效"; MISSING=1; }
          for pkg in luci-i18n-base-zh-cn luci-i18n-firewall-zh-cn luci-i18n-dockerman-zh-cn \
                     luci-i18n-ddns-zh-cn luci-i18n-udpxy-zh-cn \
                     luci-i18n-package-manager-zh-cn luci-i18n-argon-config-zh-cn luci-i18n-oaf-zh-cn; do
            if grep -q "^CONFIG_PACKAGE_${pkg}=y" .config; then
              echo "✅ ${pkg}"
            else
              echo "❌ ${pkg} 未进入固件"
              MISSING=1
            fi
          done
          if [ $MISSING -ne 0 ]; then
            echo "===== 相关符号最终状态（排查用） ====="
            grep -E '^CONFIG_LUCI_LANG_zh|^CONFIG_PACKAGE_luci-i18n-(base|firewall|dockerman|ddns|udpxy|package-manager|argon-config|oaf)-zh' .config || true
            exit 1
          fi
          echo "✅ 中文语言包全部就绪，开始编译"

      - name: Verify tool packages
        run: |
          # .config 里写错的包名会被 defconfig 静默丢弃，编 4 小时才发现白跑，所以先卡这里
          MISSING=0
          # dnsmasq 与 dnsmasq-full 互斥：同装会在 package/install 阶段报 check_data_file_clashes
          if grep -q '^CONFIG_PACKAGE_dnsmasq=y' .config; then
            echo "❌ dnsmasq 仍为 y，会与 dnsmasq-full 冲突"
            MISSING=1
          else
            echo "✅ dnsmasq 已关闭，仅保留 dnsmasq-full"
          fi
          # 只校验日常运行与排障真正要用的；纯测试类（iperf3/iftop/strace/lsof/htop/mtr/rsync/
          # pciutils/usbutils/lm-sensors/socat/conntrack）与分区类（parted/cfdisk/e2fsprogs）已移除
          for pkg in tcpdump nmap jq etherwake ethtool vim bash \
                     block-mount px5g-standalone openssl-util xl2tpd oui-vendor; do
            if grep -q "^CONFIG_PACKAGE_${pkg}=y" .config; then
              echo "✅ ${pkg}"
            else
              echo "❌ ${pkg} 未进入固件（包名可能写错了）"
              MISSING=1
            fi
          done
          for pkg in kmod-ipsec kmod-ipsec4 kmod-nft-xfrm kmod-l2tp kmod-pppol2tp; do
            if grep -q "^CONFIG_PACKAGE_${pkg}=y" .config; then
              echo "✅ ${pkg}"
            else
              echo "❌ ${pkg} 未进入固件（IPSec 容器将无法建立隧道）"
              MISSING=1
            fi
          done
          for pkg in kmod-crypto-hash kmod-crypto-hmac kmod-crypto-cbc kmod-crypto-sha1 \
                     kmod-crypto-sha256 kmod-crypto-sha512 kmod-crypto-ctr kmod-crypto-gcm \
                     kmod-crypto-ghash kmod-crypto-authenc kmod-crypto-des kmod-crypto-aead \
                     kmod-crypto-ecb kmod-crypto-md5 kmod-crypto-seqiv kmod-crypto-geniv \
                     kmod-crypto-null kmod-crypto-chacha20poly1305; do
            if grep -q "^CONFIG_PACKAGE_${pkg}=y" .config; then
              echo "✅ ${pkg}"
            else
              echo "❌ ${pkg} 未进入固件（ESP 只能退到 AES-CBC-SHA1）"
              MISSING=1
            fi
          done
          if [ $MISSING -ne 0 ]; then
            echo "===== 排查用：这些包在 .config 里的最终状态 ====="
            grep -E '^# CONFIG_PACKAGE_(parted|e2fsprogs|cfdisk|tcpdump|socat|mtr|jq|rsync|pciutils|usbutils|lm-sensors|etherwake|conntrack|iftop|strace|ethtool|iperf3|lsof|htop|vim|bash) ' .config || true
            exit 1
          fi
          echo "✅ 工具包全部就绪"

      - name: List luci-app plugins status
        run: |
          echo "=================================================="
          echo "📋 luci-app-* plugins (openwrt v${{ matrix.version }})"
          echo "=================================================="
          grep -E '^(CONFIG_PACKAGE_luci-app-.*=|# CONFIG_PACKAGE_luci-app-.* is not set)' .config | sort | while read -r line; do
            if echo "$line" | grep -q '=y\|=m'; then
              echo " ✔️ $(echo "$line" | sed -e 's/^CONFIG_PACKAGE_//' -e 's/=[ym]$//')"
            else
              echo " ❌ $(echo "$line" | sed -e 's/^# CONFIG_PACKAGE_//' -e 's/ is not set$//')"
            fi
          done
          echo "=================================================="

      - name: Build OpenWrt firmware
        id: build
        run: |
          set +e
          # rustc 1.89 的 bootstrap 在检测到 CI 环境时会拒绝 llvm.download-ci-llvm=true
          # （报 "cannot be set to true on CI. Use if-unchanged instead."），
          # 24.10.4 的 feeds/packages/lang/rust 正是因此 host 编译失败。
          # 清掉 CI 变量让它正常下载官方预编译 LLVM，避免本地从头编 LLVM。
          unset CI
          echo "开始编译 OpenWrt 固件 (openwrt v${{ matrix.version }}) - 多线程模式..."
          make -j$(nproc) 2>&1 | tee build.log
          BUILD_RESULT=${PIPESTATUS[0]}
          if [ $BUILD_RESULT -ne 0 ]; then
            echo "❌ 多线程编译失败，提取失败包并切换单线程+详细日志重编..."
            FAILED_PKG=$(grep -oP 'ERROR: \K[^ ]+(?= failed to build)' build.log | head -1)
            if [ -n "$FAILED_PKG" ]; then
              echo "🔧 清理失败包: $FAILED_PKG"
              make "$FAILED_PKG/clean" || true
            else
              echo "⚠️ 未识别到具体失败包，执行 target/linux/clean"
              make target/linux/clean || true
            fi
            make -j1 V=s 2>&1 | tee -a build.log
            BUILD_RESULT=${PIPESTATUS[0]}
          fi
          set -e
          ccache -s
          if [ $BUILD_RESULT -eq 0 ]; then
            echo "✅ 编译成功"
            echo "build_status=success" >> $GITHUB_OUTPUT
          else
            echo "❌ 编译失败"
            echo "build_status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Compress squashfs firmware
        if: steps.build.outputs.build_status == 'success'
        run: |
          echo "📦 压缩 squashfs 固件..."
          for firmware_file in bin/targets/*/*/*squashfs*; do
            if [ -f "${firmware_file}" ]; then
              echo "✅ 压缩: ${firmware_file}"
              gzip "${firmware_file}"
            fi
          done
          ls -lh bin/targets/*/*/*squashfs*.gz 2>/dev/null || true

      - name: Upload compressed firmware
        if: steps.build.outputs.build_status == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-official-${{ matrix.version }}-${{ steps.bt.outputs.stamp }}
          path: bin/targets/*/*/*squashfs*.gz
          retention-days: 30

      - name: Upload build config
        if: steps.build.outputs.build_status == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: config-official-${{ matrix.version }}
          path: .config
          include-hidden-files: true
          retention-days: 30

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-official-${{ matrix.version }}
          path: build.log
          retention-days: 7

      - name: Show build summary on failure
        if: failure()
        run: |
          echo "❌ 编译失败 (openwrt v${{ matrix.version }}) - 最后 200 行日志:"
          tail -n 200 build.log

  build-summary:
    name: Build Summary
    runs-on: ubuntu-22.04
    needs: [build]
    if: always()
    steps:
      - name: Generate dynamic summary
        run: |
          NPROC="$(nproc)"
          cat >> "$GITHUB_STEP_SUMMARY" << 'EOF'
          # 📦 OpenWrt Official (24.10.4 / 25.12.6) Build Summary

          <table>
          <tr>
            <td><strong>📡 Source</strong></td>
            <td><a href="https://github.com/openwrt/openwrt/tree/v25.12.6"><code>v25.12.6</code></a> / <a href="https://github.com/openwrt/openwrt/tree/v24.10.4"><code>v24.10.4</code></a></td>
          </tr>
          <tr>
            <td><strong>🔗 Workflow Run</strong></td>
            <td><a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"><code>#${{ github.run_id }}</code></a></td>
          </tr>
          </table>

          ---

          ## 🧩 Build Result

          | 🎯 Target | ✅ Status | 📦 Artifacts |
          | --- | --- | --- |
          | `x86_64 Generic` | ${{ needs.build.result }} | [⬇️ Download](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts) |

          ---

          ## 🎯 Target Configuration

          <table>
          <tr><td>🖥️ <strong>Platform</strong></td><td><code>x86_64 Generic</code></td></tr>
          <tr><td>🧩 <strong>Kernel Partition</strong></td><td><code>100 MB</code></td></tr>
          <tr><td>💾 <strong>Root Filesystem</strong></td><td><code>1024 MB (squashfs, persistent /var)</code></td></tr>
          </table>

          ---

          ## 🧰 Included Applications

          | 📱 Application | 📝 Source |
          | --- | --- |
          | `luci-app-openclash` | vernesong/OpenClash |
          | `luci-app-dockerman` | official feeds |
          | `luci-app-ddns` | official feeds |
          | `luci-app-udpxy` | official feeds |
          | `luci-app-firewall` | official feeds |
          | `luci-app-oaf` | destan19/OpenAppFilter |
          | `luci-theme-argon` | jerrykuku/luci-theme-argon |

          > ℹ️ *fcm/fwx 组件不在官方源码树内；其同源上游 OAF(OpenAppFilter) 已在本固件内，
          > 并在编译期打入 LAN↔LAN 跳过补丁（群晖↔摄像头等内网互传不计入客户端上下行流量）。*

          ---

          <details>
          <summary>🔍 Build environment details</summary>

          - **Runner:** Ubuntu 22.04
          - **Ccache max size:** 10 GiB
          - **Parallel jobs:** __NPROC__

          </details>
          EOF
          sed -i "s|__NPROC__|${NPROC}|g" "$GITHUB_STEP_SUMMARY"
