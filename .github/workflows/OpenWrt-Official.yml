          NAMES=${OUI_NAMES_DB:-/etc/oaf/names}
          FP=${OUI_CLIENT_DB:-/var/run/dnsmasq}
          UAD=${OUI_UA_DIR:-/var/run/oui-ua}
          MD=${OUI_MDNS_DIR:-/var/run/oui-mdns}
          DB=${OUI_DB:-/usr/share/oui-vendor/oui-db.txt}
          MDB=${OUI_MODEL_DB:-/usr/share/oui-vendor/model-db.txt}
          LK=${OUI_APPLY_LOCK:-/var/run/oui-apply.d}

          [ -r "$DB" ] || DB=/usr/share/nmap/nmap-mac-prefixes
          mkdir -p "${NAMES%/*}" "${FP%/*}" "$UAD" "$MD" 2>/dev/null
          [ -f "$NAMES" ] || : > "$NAMES"

          # 同一时间只允许一个实例（hotplug / cron / 开机可能并发）
          mkdir "$LK" 2>/dev/null || exit 0
          trap 'rmdir "$LK" 2>/dev/null' EXIT INT TERM

          norm_mac() { printf '%s' "$1" | tr 'A-F' 'a-f' | sed 's/[^0-9a-f:]/ /g' | awk '{print $1}'; }
          suffix6()  { printf '%s' "$1" | tr -d ':' | cut -c7-12; }

          clean() {
          	printf '%s' "$1" | sed -e 's/[][(){}\/\\:*?"<>|,;=]/ /g' \
          		-e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' | tr -s ' ' | cut -c1-45
          }

          fp_get() {
          	[ -f "$FP/oui.$1" ] || return 1
          	sed -n "s/^$2=//p" "$FP/oui.$1" 2>/dev/null | head -n 1
          }

          # option 60：只认具体系统，泛型（udhcp/dhcpcd/linux/esp）不算，避免盖掉厂商
          sys_from_class() {
          	vc=$(printf '%s' "$1" | tr 'A-Z' 'a-z')
          	case "$vc" in
          		*android*)                     echo Android; return 0 ;;
          		*iphone*)                      echo iPhone;  return 0 ;;
          		*ipad*)                        echo iPad;    return 0 ;;
          		*ipod*)                        echo iPod;    return 0 ;;
          		*harmony*|*openharmony*)       echo Harmony; return 0 ;;
          		*msft*|*microsoft*|*windows*)  echo Windows; return 0 ;;
          		*macintosh*|*macos*)           echo Mac;     return 0 ;;
          		*udhcp*|*dhcpcd*|*linux*|*esp*|*espressif*) return 1 ;;
          		*apple*)                       echo Apple;   return 0 ;;
          	esac
          	return 1
          }

          req_has() { case ",$REQ," in *",$1,"*) return 0 ;; esac; return 1; }

          sys_from_req() {
          	REQ=$1
          	[ -z "$REQ" ] && return 1
          	if req_has 43 && req_has 46 && req_has 51; then echo Android; return 0; fi
          	if req_has 47 && req_has 31; then echo Windows; return 0; fi
          	if req_has 95; then echo Apple; return 0; fi
          	if req_has 121 && req_has 119 && req_has 252; then echo Apple; return 0; fi
          	if req_has 44 && req_has 46 && req_has 119 && ! req_has 43; then echo Linux; return 0; fi
          	return 1
          }

          # 型号代码 -> 品牌+机型（内置 Google Play 型号库）
          model_by_code() {
          	c=$(printf '%s' "$1" | tr 'a-z' 'A-Z' | tr -d ' \r')
          	[ -z "$c" ] && return 1
          	[ -r "$MDB" ] || { echo "$1" | cut -c1-24; return 0; }
          	ln=$(awk -F'\t' -v k="$c" '$1==k{print $2"\t"$3;exit}' "$MDB" 2>/dev/null)
          	[ -z "$ln" ] && { echo "$1" | cut -c1-24; return 0; }
          	br=$(printf '%s' "$ln" | cut -f1 | tr -d ' ')
          	nm=$(printf '%s' "$ln" | cut -f2 | tr -d ' ')
          	[ -z "$nm" ] && { echo "$1" | cut -c1-24; return 0; }
          	case "$nm" in
          		*"$br"*) printf '%s\n' "$nm" ;;
          		*)
          			if [ ${#nm} -le 14 ] && [ -n "$br" ]; then printf '%s\n' "$br$nm"
          			else printf '%s\n' "$nm"; fi ;;
          	esac | cut -c1-24
          }

          # UA 里的安卓型号代码 -> 机型名
          ua_model() {
          	ua=$1
          	case "$ua" in
          		*[Aa]ndroid*|*Dalvik*) ;;
          		*) return 1 ;;
          	esac
          	m=$(printf '%s' "$ua" | sed -n 's/.*[;(][ ]*\([A-Za-z0-9._-]\+\)[ ]*Build\/.*/\1/p' | head -n 1)
          	[ -z "$m" ] && m=$(printf '%s' "$ua" | sed -n 's/.*[Aa]ndroid[ ]*[0-9.]*;[ ]*\([^;)]*\)[ ]*[;)].*/\1/p' | head -n 1)
          	m=$(printf '%s' "$m" | tr -d ' \r')
          	[ -z "$m" ] && return 1
          	model_by_code "$m"
