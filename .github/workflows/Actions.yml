name: 清理Actions旧记录
on:
  workflow_dispatch:

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 2
          delete_workflow_by_state_pattern: ALL
          delete_run_by_conclusion_pattern: ALL
          dry_run: false
