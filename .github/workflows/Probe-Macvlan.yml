name: Probe-Macvlan

# 目的：只跑 feeds 前的 defconfig，验证在官方 openwrt-25.12 源码树上
# 显式写 CONFIG_PACKAGE_kmod-macvlan=y 后，make defconfig 是保留还是丢弃。
# 不编译固件，约 5-8 分钟，不占满 runner。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Probe kmod-macvlan
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout openwrt source
        uses: actions/checkout@v4
        with:
          repository: openwrt/openwrt
          ref: openwrt-25.12
          fetch-depth: 1

      - name: Install deps
        run: |
          set -e
          if timeout 15 bash -c 'exec 3<>/dev/tcp/azure.archive.ubuntu.com/80' 2>/dev/null; then
            echo "azure 源可达"
          else
            for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources \
                     /etc/apt/sources.list.d/*.list /etc/apt/apt-mirrors.txt; do
              [ -f "$f" ] && sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' "$f"
            done
          fi
          for i in 1 2 3; do
            sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=15 && break
            sleep 10
          done
          sudo apt-get install -y -o Acquire::Retries=3 \
            build-essential libncurses5-dev gawk git libssl-dev gettext \
            zlib1g-dev swig unzip rsync python3 wget file libelf-dev bison flex pkgconf

      - name: Source evidence (macvlan definitions)
        run: |
          set -x
          echo "=== 1) package 定义 ==="
          grep -rn "KernelPackage/macvlan" package/kernel/linux/modules/ || echo "NO_PACKAGE_DEF"
          echo "=== 2) 内核 config 现状 ==="
          grep -rn -E "CONFIG_MACVLAN|CONFIG_MACVTAP|CONFIG_IPVLAN" \
            target/linux/generic/config-6.12 target/linux/x86/config-6.12 || echo "NO_KCONFIG_LINE"
          echo "=== 3) 同族 kmod-tun 作对照 ==="
          grep -rn "KernelPackage/tun" package/kernel/linux/modules/ | head -3 || true
          echo "=== 4) 源码版本 ==="
          git log -1 --format='commit=%H date=%ci'

      - name: Defconfig with kmod-macvlan
        run: |
          set -x
          printf 'CONFIG_TARGET_x86=y\nCONFIG_TARGET_x86_64=y\nCONFIG_TARGET_x86_64_Generic=y\nCONFIG_PACKAGE_kmod-macvlan=y\n' > .config
          cat .config
          make defconfig 2>&1 | tail -25
          echo "================= RESULT ================="
          if grep -q '^CONFIG_PACKAGE_kmod-macvlan=y' .config; then
            echo "INJECT_RESULT=kept"
          elif grep -q '^# CONFIG_PACKAGE_kmod-macvlan is not set' .config; then
            echo "INJECT_RESULT=dropped"
          else
            echo "INJECT_RESULT=absent"
          fi
          echo "--- defconfig 后相关行 ---"
          grep -nE 'CONFIG_MACVLAN|CONFIG_MACVTAP|CONFIG_PACKAGE_kmod-macvlan' .config || echo "NONE"
          echo "--- kmod-tun 对照 ---"
          grep -nE 'CONFIG_PACKAGE_kmod-tun|CONFIG_TUN' .config || echo "NONE"
          echo "================= END ================="

      - name: Producer check
        run: |
          echo "=== 若 kept，则 build_dir 阶段会生成 macvlan.ko；此处只确认包是否进入构建列表 ==="
          grep -q '^CONFIG_PACKAGE_kmod-macvlan=y' .config && echo "KEPT_IN_BUILD_LIST" || echo "NOT_IN_BUILD_LIST"
