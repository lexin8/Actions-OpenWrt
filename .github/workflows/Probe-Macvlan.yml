name: Probe-Macvlan

# 目的：只跑 defconfig（不编固件），验证在官方 openwrt-25.12 源码树上
# 显式写 CONFIG_PACKAGE_kmod-macvlan=y 后，make defconfig 是保留还是丢弃。
# 关键结论全部写入 run 的 Summary，方便直接读取。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Probe kmod-macvlan
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout openwrt source
        uses: actions/checkout@v4
        with:
          repository: openwrt/openwrt
          ref: openwrt-25.12
          fetch-depth: 1

      - name: Install deps
        run: |
          set -e
          for f in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list; do
            [ -f "$f" ] && sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' "$f"
          done
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y -o Acquire::Retries=3 build-essential libncurses5-dev gawk git libssl-dev gettext zlib1g-dev swig unzip rsync python3 wget file libelf-dev bison flex pkgconf

      - name: Source evidence
        run: |
          {
            echo "## 1) 源码侧证据 (openwrt/openwrt openwrt-25.12)"
            echo ""
            echo '```'
            echo "### 包定义:"
            grep -rn "KernelPackage/macvlan" package/kernel/linux/modules/ || echo "NO_PACKAGE_DEF"
            echo ""
            echo "### generic config:"
            grep -rn -E "CONFIG_MACVLAN|CONFIG_MACVTAP|CONFIG_MACVLAN_" target/linux/generic/config-6.12 || echo "NO_KCONFIG_LINE"
            echo ""
            echo "### kmod-tun 对照 (同族虚拟网卡):"
            grep -rn "KernelPackage/tun" package/kernel/linux/modules/ | head -2 || true
            echo ""
            echo "### commit:"
            git log -1 --format='%H %ci'
            echo '```'
          } >> $GITHUB_STEP_SUMMARY

      - name: Defconfig with kmod-macvlan
        run: |
          set +e
          printf 'CONFIG_TARGET_x86=y\nCONFIG_TARGET_x86_64=y\nCONFIG_TARGET_x86_64_Generic=y\nCONFIG_PACKAGE_kmod-macvlan=y\n' > .config
          make defconfig 2>&1 | tail -20
          if grep -q '^CONFIG_PACKAGE_kmod-macvlan=y' .config; then
            RES=kept
          elif grep -q '^# CONFIG_PACKAGE_kmod-macvlan is not set' .config; then
            RES=dropped
          else
            RES=absent
          fi
          echo "INJECT_RESULT=$RES"
          {
            echo ""
            echo "## 2) defconfig 结果"
            echo ""
            echo "**INJECT_RESULT = $RES**  （kept=符号可用，dropped=被依赖链吃掉，absent=符号不存在）"
            echo ""
            echo '```'
            echo "### .config 里相关行:"
            grep -nE 'CONFIG_MACVLAN|CONFIG_MACVTAP|CONFIG_PACKAGE_kmod-macvlan' .config || echo "NONE"
            echo ""
            echo "### kmod-tun 对照 (证明这套机制本身没坏):"
            grep -nE 'CONFIG_PACKAGE_kmod-tun|CONFIG_TUN' .config || echo "NONE"
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
          echo "==============================="
          grep -nE 'CONFIG_MACVLAN|CONFIG_MACVTAP|CONFIG_PACKAGE_kmod-macvlan|CONFIG_PACKAGE_kmod-tun|CONFIG_TUN' .config || echo NONE

      - name: Kernel fragment check
        run: |
          {
            echo ""
            echo "## 3) 内核 config 最终值"
            echo ""
            echo '```'
            if [ -f .config ]; then
              awk -F= '/^CONFIG_MACVLAN/ {print}' .config || true
            fi
            echo "--- target/linux/generic/config-6.12 原文 ---"
            grep -n -E "CONFIG_MACVLAN|CONFIG_MACVTAP" target/linux/generic/config-6.12 || echo NONE
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
          echo done
